name: Download Prime Report

on:
  schedule:
    # GitHub schedules are best-effort and can be delayed or dropped. Keep the
    # 07:00 BRT run, then use five backup triggers at 15-minute intervals.
    - cron: '0,15,30,45 10 * * 1'
    - cron: '0,15 11 * * 1'
  workflow_dispatch:

permissions:
  contents: write

# Only one download may run at a time. Later backup triggers remain harmless
# because the freshness check skips them after the first successful update.
concurrency:
  group: download-prime-report
  cancel-in-progress: false

jobs:
  download-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether this week's report was already updated
        id: freshness
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "download=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cutoff=$(date -u -d "$(date -u +%F) 10:00:00" +%s)
          last_update=$(git log -1 --format=%ct -- prime-report.pdf || echo 0)

          if (( last_update >= cutoff )); then
            echo "The report was already updated by an earlier Monday run."
            echo "download=false" >> "$GITHUB_OUTPUT"
          else
            echo "The weekly report is stale; starting the download."
            echo "download=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.freshness.outputs.download == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        if: steps.freshness.outputs.download == 'true'
        run: npm install --no-save puppeteer

      - name: Download Prime Report (retry up to five times)
        if: steps.freshness.outputs.download == 'true'
        shell: bash
        env:
          PRIME_EMPRESA: ${{ secrets.PRIME_EMPRESA }}
          PRIME_USUARIO: ${{ secrets.PRIME_USUARIO }}
          PRIME_SENHA: ${{ secrets.PRIME_SENHA }}
        run: |
          max_attempts=6 # Initial execution plus at least five retries.
          for attempt in $(seq 1 "$max_attempts"); do
            echo "::group::Download attempt ${attempt}/${max_attempts}"
            rm -rf downloads

            if node .github/scripts/download-prime-report.js; then
              echo "::endgroup::"
              exit 0
            fi

            echo "::endgroup::"
            if (( attempt < max_attempts )); then
              delay=$((attempt * 30))
              echo "Attempt ${attempt} failed; retrying in ${delay} seconds..."
              sleep "$delay"
            fi
          done

          echo "Download failed after ${max_attempts} attempts."
          exit 1

      - name: Upload screenshots
        if: always() && steps.freshness.outputs.download == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-${{ github.run_attempt }}
          path: '*.png'
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit report
        if: success() && steps.freshness.outputs.download == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add prime-report.pdf
          if git diff --staged --quiet; then
            echo "Prime report is already up to date."
            exit 0
          fi

          git commit -m "Update Prime report [automated]"

          # Other scheduled workflows also commit generated data. Rebase the
          # report commit before pushing so a concurrent update does not cause
          # a non-fast-forward failure.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi

            echo "Push attempt ${attempt} failed; retrying after 5 seconds..."
            sleep 5
          done

          echo "Unable to push the report after 3 attempts."
          exit 1
